function getConcentrationClass(score) {
  if (score >= 0.15) return 'concentration-high';
  if (score >= 0.08) return 'concentration-medium';
  return 'concentration-low';
}

function renderTopics() {
  const container = document.getElementById('topics-container');
  const tooltip = document.getElementById('global-tooltip');

  topicsData.forEach(topic => {
    const div = document.createElement('div');
    div.className = 'topic-cloud';

    const h2 = document.createElement('h2');
    const titleSpan = document.createElement('span');
    titleSpan.textContent = `Topic ${topic.num} (${topic.prevalence})`;
    const badge = document.createElement('span');
    badge.className = `concentration-badge ${getConcentrationClass(topic.concentration)}`;
    badge.textContent = `${topic.concentration.toFixed(3)}`;
    h2.appendChild(titleSpan);
    h2.appendChild(badge);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 760 350');

    const topMotions = document.createElement('div');
    const topMotionsList = topMotionsByTopic[topic.num] || [];
    topMotions.innerHTML = `<p style="margin: 8px 0 6px; font-size: 16px; color: #333; font-weight: 600; text-transform: uppercase;">Top ${topMotionsList.length} motions by Topic ${topic.num} probability</p>`;

    const topList = document.createElement('ul');
    topList.style.margin = '0';
    topList.style.paddingLeft = '20px';
    topList.style.fontSize = '14px';
    topList.style.lineHeight = '1.6';
    topList.style.color = '#444';

    topMotionsList.forEach(m => {
      const li = document.createElement('li');
      li.textContent = (m.title || '(untitled)') + ' (' + m.year + ') — ' + (m.prob || 0).toFixed(4);
      li.style.marginBottom = '2px';
      li.style.wordBreak = 'break-word';
      topList.appendChild(li);
    });

    topMotions.appendChild(topList);

    const content = document.createElement('div');
    content.style.display = 'grid';
    content.style.gridTemplateColumns = '1.5fr 1fr';
    content.style.gap = '20px';
    content.style.alignItems = 'start';

    const cloudCol = document.createElement('div');
    cloudCol.appendChild(svg);
    const listCol = document.createElement('div');
    listCol.appendChild(topMotions);

    content.appendChild(cloudCol);
    content.appendChild(listCol);

    div.appendChild(h2);
    div.appendChild(content);
    container.appendChild(div);

    const size = d3.scaleSqrt()
      .domain(d3.extent(topic.words, d => d.p))
      .range([20, 72]);

    const words = topic.words.map(d => ({...d, size: size(d.p), rotate: 0}));

    d3.layout.cloud()
      .size([520, 360])
      .words(words)
      .padding(5)
      .random(() => 0.42)
      .font('sans-serif')
      .fontWeight(500)
      .fontSize(d => d.size)
      .rotate(d => d.rotate)
      .on('end', wordList => {
        const group = d3.select(svg)
          .append('g')
          .attr('transform', 'translate(260,180)');

        group.selectAll('text')
          .data(wordList)
          .join('text')
          .attr('class', 'word')
          .attr('text-anchor', 'middle')
          .attr('font-size', d => d.size)
          .attr('fill', () => d3.schemeCategory10[Math.floor(Math.random() * 10)])
          .attr('transform', d => `translate(${d.x},${d.y})rotate(${d.rotate})`)
          .text(d => d.text)
          .on('mouseenter', function(event, d) {
            tooltip.textContent = `${d.text}: ${(d.p * 100).toFixed(2)}%`;
            tooltip.style.opacity = '1';
          })
          .on('mousemove', function(event) {
            tooltip.style.left = (event.pageX + 10) + 'px';
            tooltip.style.top = (event.pageY + 10) + 'px';
          })
          .on('mouseleave', () => {
            tooltip.style.opacity = '0';
          });
      })
      .start();
  });
}

renderTopics();
