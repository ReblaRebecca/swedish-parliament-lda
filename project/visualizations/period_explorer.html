<style>
  /* Layout: masthead, then one card per chain; each card holds four word
     clouds, one per period, in a row that wraps to two columns on narrow screens. */
  :root {
    --paper: #f4f6f8;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5a6575;
    --rule: #dbe1e8;
    --accent: #1d5a8c;
    --accent-soft: #e2ecf5;
    --gold: #a8761c;
    --gold-soft: #f5ead2;
    /* Word colour = persistence: in how many of the chain's four periods the word is among the top words */
    --persist-4: #0b3d6e;
    --persist-3: #2f74b5;
    --persist-2: #7eaedb;
    --persist-1: #a3abb5;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --font-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --step--1: 0.8125rem;
    --step-0: 1rem;
    --step-1: 1.25rem;
    --step-2: 1.75rem;
    --step-3: 2.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #10151c;
      --surface: #171f29;
      --ink: #e5eaf0;
      --muted: #9ba7b6;
      --rule: #2a3543;
      --accent: #84b6e2;
      --accent-soft: #1c2f42;
      --gold: #e2b65e;
      --gold-soft: #3a2e17;
      --persist-4: #a8d5ff;
      --persist-3: #5f9fd9;
      --persist-2: #3b6894;
      --persist-1: #646e7b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #10151c;
    --surface: #171f29;
    --ink: #e5eaf0;
    --muted: #9ba7b6;
    --rule: #2a3543;
    --accent: #84b6e2;
    --accent-soft: #1c2f42;
    --gold: #e2b65e;
    --gold-soft: #3a2e17;
    --persist-4: #a8d5ff;
    --persist-3: #5f9fd9;
    --persist-2: #3b6894;
    --persist-1: #646e7b;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--step-0);
    line-height: 1.5;
    padding-inline: 20px;
  }
  .page { max-width: 1280px; margin-inline: auto; display: grid; gap: 24px; padding-block: 32px 56px; }

  .masthead { display: grid; gap: 8px; }
  .eyebrow { font-family: var(--font-data); font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-3); line-height: 1.1; text-wrap: balance; }
  .lede { color: var(--muted); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 32px; }
  @media (max-width: 1100px) { .lede { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .lede { grid-template-columns: minmax(0, 1fr); } }
  .lede strong { color: var(--ink); font-weight: 600; }
  .lede ul { list-style: none; margin: 6px 0 0; padding: 0; font-variant-numeric: tabular-nums; }
  .lede li { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); padding: 3px 0; }
  .lede li span:first-child { color: var(--ink); }

  .grid { display: grid; gap: 16px; }
  .chain {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 14px 16px; display: grid; gap: 10px;
  }
  .chain-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .chain-head h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); }
  .meta { font-family: var(--font-data); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .periods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .periods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .periods { grid-template-columns: minmax(0, 1fr); } }
  /* Continuity: a solid accent bar runs over the cells joined by links >= the chain criterion; at a weak
     link the bar stops and a dashed gold rule separates the cells, so the row reads as separate segments. */
  .cell { display: grid; gap: 4px; align-content: start; border-top: 3px solid var(--rule); padding-top: 6px; }
  .cell.joined { border-top-color: var(--accent); }
  .cell.after-break { border-left: 2px dashed var(--gold); padding-left: 10px; margin-left: -8px; }
  .break-note { flex-basis: 100%; font-family: var(--font-body); font-size: 0.75rem; color: var(--gold); }
  .cell-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cell-head .period { color: var(--ink); font-weight: 500; letter-spacing: 0.04em; }
  .chip {
    font-family: var(--font-data); font-size: 0.75rem; font-weight: 500;
    padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--ink);
  }
  .chip.unstable { background: var(--gold-soft); box-shadow: inset 0 0 0 1px var(--gold); }
  .cell-name { font-family: var(--font-display); font-weight: 600; font-size: 0.9375rem; line-height: 1.25; color: var(--ink); }

  .cloud { width: 100%; height: auto; display: block; }
  .cloud text { font-family: var(--font-display); font-weight: 500; }
  .cloud .p4 { fill: var(--persist-4); }
  .cloud .p3 { fill: var(--persist-3); }
  .cloud .p2 { fill: var(--persist-2); }
  .cloud .p1 { fill: var(--persist-1); }
</style>

<script>
(function () {
  const grid = document.getElementById('grid');
  const W = 320, H = 210;
  const layoutCache = {};

  const pct = v => (v * 100).toFixed(1) + '%';
  // Similarity with two decimals, or three when two would round across the chain criterion (0.498 is not 0.50)
  const sim = c => ((c < DATA.chainCosine) === (+c.toFixed(2) < DATA.chainCosine) ? c.toFixed(2) : c.toFixed(3));
  const canvas = document.createElement('canvas').getContext('2d');
  function measure(text, size, weight) {
    canvas.font = `${weight} ${size}px "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif`;
    return { w: canvas.measureText(text).width, h: size * 0.92 };
  }

  // Spiral word placement of one cloud at the given sizes; null if some word does not fit
  function placeWords(words, sizeOf) {
    const placed = [];
    for (let i = 0; i < words.length; i++) {
      const [text, p] = words[i];
      const size = sizeOf(p);
      const weight = i < 3 ? 700 : 500;
      const m = measure(text, size, weight);
      const bw = m.w + 3, bh = m.h + 2;
      let spot = null;
      for (let t = 0; t < 900 && !spot; t += 0.12) {
        const r = 2.4 * t;
        const x = W / 2 + r * Math.cos(t) * 1.5 - bw / 2;
        const y = H / 2 + r * Math.sin(t) - bh / 2;
        if (x < 2 || y < 2 || x + bw > W - 2 || y + bh > H - 2) { if (r > W) break; continue; }
        if (placed.every(q => x + bw <= q.x || q.x + q.w <= x || y + bh <= q.y || q.y + q.h <= y)) {
          spot = { x, y, w: bw, h: bh };
        }
      }
      if (!spot) return null;
      placed.push({ ...spot, text, p, size, weight, rank: i });
    }
    return placed;
  }

  // The four clouds of a chain share one size scale (square root of the probability, between the
  // chain's smallest and largest shown probability), so sizes are comparable across its periods.
  // If a word does not fit in some cloud, all four shrink together and the layout restarts.
  function layoutChain(row) {
    const ps = row.cells.flatMap(c => c.words.map(w => w[1]));
    const pmax = Math.max(...ps), pmin = Math.min(...ps);
    const sq = p => pmax === pmin ? 1 : (Math.sqrt(p) - Math.sqrt(pmin)) / (Math.sqrt(pmax) - Math.sqrt(pmin));
    let maxSize = 40, minSize = 12;
    for (let attempt = 0; attempt < 14; attempt++) {
      const sizeOf = p => minSize + sq(p) * (maxSize - minSize);
      const clouds = row.cells.map(c => placeWords(c.words, sizeOf));
      if (clouds.every(Boolean)) return clouds;
      maxSize *= 0.9;
      minSize = Math.max(9, minSize * 0.95);
    }
    return row.cells.map(() => []);
  }

  function svgEl(name, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Persistence: in how many periods of the chain each word is among the topic's top words
  function persistence(row) {
    const n = {};
    for (const cell of row.cells) for (const [text] of cell.words) n[text] = (n[text] || 0) + 1;
    return n;
  }

  function cloudSvg(cell, placed, persist) {
    const svg = svgEl('svg', { class: 'cloud', viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': 'Word cloud: ' + cell.words.slice(0, 10).map(w => w[0]).join(', ') });
    for (const w of placed) {
      const n = persist[w.text];
      const t = svgEl('text', { x: (w.x + w.w / 2).toFixed(1), y: (w.y + w.h / 2).toFixed(1),
        'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': w.size.toFixed(1), class: 'p' + n });
      t.textContent = w.text;
      const tip = svgEl('title', {});
      tip.textContent = `${w.text}: ${(w.p * 100).toFixed(2)}% · top words in ${n} of ${DATA.periods.length} periods`;
      t.appendChild(tip);
      svg.appendChild(t);
    }
    return svg;
  }

  function span(className, text) {
    const s = document.createElement('span');
    s.className = className;
    s.textContent = text;
    return s;
  }

  function cellEl(cell, p, row, placed, persist) {
    const div = document.createElement('div');
    div.className = 'cell';
    const head = document.createElement('div');
    head.className = 'cell-head';
    const share = span('', pct(cell.share));
    share.title = `${pct(cell.share)} of the period's motion content (all the period's topics add up to 100%); topic ${cell.topic} of this period's model`;
    head.append(span('period', DATA.periods[p]), share);
    if (cell.stability) {
      // High: found again in every other seed's model; medium: all but one; low (gold): fewer
      const { found, of } = cell.stability;
      const level = found === of ? 'high' : (found === of - 1 ? 'medium' : 'low');
      const chip = span('chip' + (level === 'low' ? ' unstable' : ''), `stability ${level} (${found}/${of})`);
      chip.title = `Found again in ${found} of ${of} models of this period fitted with other random seeds`;
      head.appendChild(chip);
    }
    const strong = c => c !== undefined && c >= DATA.chainCosine;
    if (strong(row.links[p - 1]) || strong(row.links[p])) div.classList.add('joined');
    // A weak link to the previous period breaks the row; link values themselves are not shown
    if (p > 0 && row.links[p - 1] < DATA.chainCosine) {
      div.classList.add('after-break');
      head.appendChild(span('break-note', `Alignment uncertain: not linked to ${DATA.periods[p - 1]}`));
    }
    div.appendChild(head);
    if (cell.name) {
      const name = document.createElement('p');
      name.className = 'cell-name';
      name.textContent = cell.name;
      div.appendChild(name);
    }
    div.appendChild(cloudSvg(cell, placed, persist));
    return div;
  }

  // Gordon's chain criterion is the mean of the links
  const meanLink = row => row.links.reduce((a, b) => a + b, 0) / row.links.length;

  function card(row) {
    const art = document.createElement('article');
    art.className = 'chain';
    const head = document.createElement('header');
    head.className = 'chain-head';
    const h2 = document.createElement('h2');
    h2.textContent = row.name || `Chain ${row.row}`;
    const mean = meanLink(row);
    head.append(h2, span('meta', `Average similarity: ${sim(mean)}`));
    const periods = document.createElement('div');
    periods.className = 'periods';
    const persist = persistence(row);
    if (!layoutCache[row.row]) layoutCache[row.row] = layoutChain(row);
    row.cells.forEach((cell, p) => periods.appendChild(cellEl(cell, p, row, layoutCache[row.row][p], persist)));
    art.append(head, periods);
    return art;
  }

  // Strongest chain first: by mean link, then by weakest link
  function render() {
    const weakest = r => Math.min(...r.links);
    const rows = DATA.rows.slice().sort((a, b) => meanLink(b) - meanLink(a) || weakest(b) - weakest(a));
    grid.replaceChildren(...rows.map(card));
  }

  // Static text from the data
  const total = DATA.periodCounts.reduce((a, b) => a + b, 0);
  const topN = DATA.rows[0].cells[0].words.length;
  const bins = DATA.periods.map((p, i) => `<li><span>${p}</span><span>${DATA.periodCounts[i].toLocaleString('en')} motions</span></li>`).join('');
  document.getElementById('lede').innerHTML =
    `<div><p><strong>Period models:</strong> the body text of <strong>${total.toLocaleString('en')} motions</strong> is divided into ` +
    `${DATA.periods.length} periods by electoral term.</p><ul>${bins}</ul></div>` +
    `<p>New topics are created separately for each period, <strong>${DATA.numTopics} topics per period</strong>, each period with its own vocabulary. ` +
    `Each word cloud shows the ${topN} words most strongly associated with that topic during that particular period.</p>` +
    `<p>The percentage above each word cloud shows the topic’s average proportion across all motions in that period. ` +
    `It is not the percentage of motions about the topic, since every motion can contain several topics; ` +
    `the ${DATA.numTopics} topics of a period add up to 100%.</p>` +
    `<p>Similar topics are then connected across periods, one row per chain, making it possible to see how their vocabulary ` +
    `and meaning may have changed over time.</p>`;
  // Measure words only once the display font has loaded, so the layout matches what is drawn
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load('500 20px "Bricolage Grotesque"'), document.fonts.load('700 20px "Bricolage Grotesque"')]).catch(() => {})
    : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(render);
})();
</script>
