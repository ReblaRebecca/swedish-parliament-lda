<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: masthead, then one column of topic cards; each card puts the
     word cloud with the electoral-term chart under it in the left column and the topic's top motions in the
     right column, stacking on narrow screens. */
  :root {
    --paper: #f4f6f8;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5a6575;
    --rule: #dbe1e8;
    --accent: #1d5a8c;
    --accent-soft: #e2ecf5;
    --word-mid: #2b3a4d;
    --word-low: #7a8697;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --font-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --step--1: 0.8125rem;
    --step-0: 1rem;
    --step-1: 1.25rem;
    --step-2: 1.75rem;
    --step-3: 2.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #10151c;
      --surface: #171f29;
      --ink: #e5eaf0;
      --muted: #9ba7b6;
      --rule: #2a3543;
      --accent: #84b6e2;
      --accent-soft: #1c2f42;
      --word-mid: #d3dbe5;
      --word-low: #8995a6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #10151c;
    --surface: #171f29;
    --ink: #e5eaf0;
    --muted: #9ba7b6;
    --rule: #2a3543;
    --accent: #84b6e2;
    --accent-soft: #1c2f42;
    --word-mid: #d3dbe5;
    --word-low: #8995a6;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--step-0);
    line-height: 1.5;
    padding-inline: 20px;
  }
  .page { max-width: 1180px; margin-inline: auto; display: grid; gap: 24px; padding-block: 32px 56px; }

  .masthead { display: grid; gap: 8px; }
  .eyebrow { font-family: var(--font-data); font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-3); line-height: 1.1; text-wrap: balance; }
  .lede { color: var(--muted); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 32px; }
  @media (max-width: 760px) { .lede { grid-template-columns: minmax(0, 1fr); } }
  .lede strong { color: var(--ink); font-weight: 600; }

  .grid { display: grid; gap: 16px; }
  .topic {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 16px 18px; display: grid; gap: 10px;
  }
  .topic-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .topic-head h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); }
  .share { font-family: var(--font-data); font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip {
    font-family: var(--font-data); font-size: 0.8125rem; font-weight: 500;
    padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .topic-body { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 760px) { .topic-body { grid-template-columns: minmax(0, 1fr); } }
  .left { display: grid; gap: 12px; }

  .cloud { width: 100%; height: auto; display: block; }
  .cloud text { font-family: var(--font-display); font-weight: 500; }
  .cloud .w1 { fill: var(--accent); font-weight: 700; }
  .cloud .w2 { fill: var(--word-mid); }
  .cloud .w3 { fill: var(--word-low); }

  .periods figcaption, .motions-head { font-family: var(--font-data); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .periods svg { width: 100%; max-width: 480px; height: auto; display: block; }
  .periods .bar { fill: var(--accent); }
  .periods .val { fill: var(--ink); font-family: var(--font-data); font-size: 9.5px; }
  .periods .lab { fill: var(--muted); font-family: var(--font-data); font-size: 9.5px; }
  .periods .base { stroke: var(--rule); stroke-width: 1; }

  .motions { list-style: none; display: grid; gap: 6px; padding: 0; margin: 0; }
  .motions li { display: grid; gap: 1px; }
  .m-title { font-size: 0.9375rem; line-height: 1.3; overflow-wrap: anywhere; }
  /* The party chip sits on the Top motions heading line, without the heading's uppercase */
  .motions-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .motions-head .chip { text-transform: none; letter-spacing: 0; }
  .m-meta { font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  footer { color: var(--muted); font-size: var(--step--1); border-top: 1px solid var(--rule); padding-top: 14px; max-width: 80ch; }
</style>

    if (!layoutCache[modelKey]) layoutCache[modelKey] = layoutAll(DATA.topicList);
    const svg = svgEl('svg', { class: 'cloud', viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': 'Word cloud: ' + topic.words.slice(0, 10).map(w => w[0]).join(', ') });
    for (const w of layoutCache[modelKey][topic.num]) {
      const tier = w.rank < 3 ? 'w1' : (w.rank < 12 ? 'w2' : 'w3');
      const t = svgEl('text', { x: (w.x + w.w / 2).toFixed(1), y: (w.y + w.h / 2).toFixed(1),
        'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': w.size.toFixed(1), class: tier });
      t.textContent = w.text;
      const tip = svgEl('title', {});
      tip.textContent = `${w.text}: ${(w.p * 100).toFixed(2)}%`;
      t.appendChild(tip);
      svg.appendChild(t);
    }
    return svg;
  }

  function termChart(topic) {
    const cw = 480, ch = 112, top = 18, bottom = 20, left = 4;
    const max = Math.max(...topic.terms) || 1;
    const slot = (cw - left * 2) / topic.terms.length;
    const barW = slot * 0.62;
    const svg = svgEl('svg', { viewBox: `0 0 ${cw} ${ch}`, role: 'img',
      'aria-label': 'Share by electoral term: ' + DATA.terms.map((p, i) => `${p} ${pct(topic.terms[i])}`).join(', ') });
    const plotH = ch - top - bottom;
    topic.terms.forEach((v, i) => {
      const h = Math.max(1, (v / max) * plotH);
      const x = left + i * slot + (slot - barW) / 2;
      const bar = svgEl('rect', { class: 'bar', x: x.toFixed(1), y: (top + plotH - h).toFixed(1), width: barW.toFixed(1), height: h.toFixed(1), rx: 2 });
      const tip = svgEl('title', {});
      tip.textContent = `${DATA.terms[i]}: ${pct(v)} (${DATA.termCounts[i].toLocaleString('en')} motions)`;
      bar.appendChild(tip);
      svg.appendChild(bar);
      const val = svgEl('text', { class: 'val', x: (x + barW / 2).toFixed(1), y: (top + plotH - h - 5).toFixed(1), 'text-anchor': 'middle' });
      val.textContent = pct(v);
      svg.appendChild(val);
      const lab = svgEl('text', { class: 'lab', x: (x + barW / 2).toFixed(1), y: ch - 5, 'text-anchor': 'middle' });
      lab.textContent = DATA.terms[i];
      svg.appendChild(lab);
    });
    svg.appendChild(svgEl('line', { class: 'base', x1: left, x2: cw - left, y1: top + plotH + 0.5, y2: top + plotH + 0.5 }));
    return svg;
  }

  function card(topic, modelKey) {
    const art = document.createElement('article');
    art.className = 'topic';
    art.id = `topic-${modelKey}-${topic.num}`;

    const head = document.createElement('header');
    head.className = 'topic-head';
    const h2 = document.createElement('h2');
    h2.textContent = topic.name || `Topic ${topic.num}`;
    const share = document.createElement('span');
    share.className = 'share';
    share.textContent = `share ${pct(topic.share)}`;
    head.append(h2, share);

    const body = document.createElement('div');
    body.className = 'topic-body';
    const left = document.createElement('div');
    left.className = 'left';

    const fig = document.createElement('figure');
    fig.className = 'periods';
    const cap = document.createElement('figcaption');
    cap.textContent = 'Average share across all motions in each electoral term';
    fig.append(cap, termChart(topic));

    const mh = document.createElement('p');
    mh.className = 'motions-head';
    mh.textContent = 'Top motions';
    // Party chip, in the party's colour, only if enough of the motions shown share the first signatory's party
    if (topic.partyCount >= DATA.partyMin) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.background = topic.partyColours[0];
      chip.style.color = topic.partyColours[1];
      chip.textContent = `${topic.partyName} ${topic.partyCount}/${topic.partyOf}`;
      chip.title = `${topic.partyCount} of the top ${topic.partyOf} motions have a first signatory from ${topic.partyName}`;
      mh.appendChild(chip);
    }
    const ol = document.createElement('ol');
    ol.className = 'motions';
    topic.motions.forEach(m => {
      const li = document.createElement('li');
      const title = document.createElement('span');
      title.className = 'm-title';
      title.textContent = m.title || '(no title)';
      const meta = document.createElement('span');
      meta.className = 'm-meta';
      meta.textContent = `${m.session || m.year} · ${m.partyName} · ${m.id} · θ ${m.theta.toFixed(2)}`;
      li.append(title, meta);
      ol.appendChild(li);
    });
    const motions = document.createElement('div');
    motions.append(mh, ol);
    left.append(cloudSvg(topic, modelKey), fig);
    body.append(left, motions);
    art.append(head, body);
    return art;
  }

  // Largest overall share first
  function render() {
    const topics = DATA.topicList.slice().sort((a, b) => b.share - a.share);
    grid.replaceChildren(...topics.map(t => card(t, 'model')));
  }

  // Static text from the data
  document.getElementById('lede').innerHTML =
    `<p><strong>Full-corpus model:</strong> gives an overall picture of the main themes during the entire 40-year period, ` +
    `with <strong>${DATA.topics} topics</strong> created from the body text of all <strong>${DATA.motions.toLocaleString('en')} motions</strong>.</p>` +
    `<p>Each word cloud shows the ${DATA.topicList[0].words.length} words most strongly associated with that topic.</p>` +
    `<p>Since the topics and their words are created from the complete corpus, the same topics can be followed ` +
    `to see whether their prominence rises or falls over time.</p>`;
  document.getElementById('footer').textContent =
    `Generated ${DATA.generated} by modeling/14_generate_topic_explorer.py from models/baseline_lda_${DATA.topics} ` +
    `(scikit-learn LDA, ${DATA.topics} topics). Motions per period: ` +
    DATA.periods.map((p, i) => `${p} ${DATA.periodCounts[i].toLocaleString('en')}`).join(', ') + '. ' +
    'Topic numbers are arbitrary: a model fitted with another seed numbers its topics differently.';

  // Measure words only once the display font has loaded, so the layout matches what is drawn
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load('500 20px "Bricolage Grotesque"'), document.fonts.load('700 20px "Bricolage Grotesque"')]).catch(() => {})
    : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(render);
})();
</script>
