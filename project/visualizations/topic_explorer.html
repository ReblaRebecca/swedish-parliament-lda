<style>
  /* Layout: masthead, sticky control bar, then one column of topic cards; each card puts the
     word cloud with the period chart under it in the left column and the topic's top motions in the
     right column, stacking on narrow screens. */
  :root {
    --paper: #f4f6f8;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5a6575;
    --rule: #dbe1e8;
    --accent: #1d5a8c;
    --accent-soft: #e2ecf5;
    --gold: #a8761c;
    --gold-soft: #f5ead2;
    --word-mid: #2b3a4d;
    --word-low: #7a8697;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --font-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --step--1: 0.8125rem;
    --step-0: 1rem;
    --step-1: 1.25rem;
    --step-2: 1.75rem;
    --step-3: 2.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #10151c;
      --surface: #171f29;
      --ink: #e5eaf0;
      --muted: #9ba7b6;
      --rule: #2a3543;
      --accent: #84b6e2;
      --accent-soft: #1c2f42;
      --gold: #e2b65e;
      --gold-soft: #3a2e17;
      --word-mid: #d3dbe5;
      --word-low: #8995a6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #10151c;
    --surface: #171f29;
    --ink: #e5eaf0;
    --muted: #9ba7b6;
    --rule: #2a3543;
    --accent: #84b6e2;
    --accent-soft: #1c2f42;
    --gold: #e2b65e;
    --gold-soft: #3a2e17;
    --word-mid: #d3dbe5;
    --word-low: #8995a6;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--step-0);
    line-height: 1.5;
    padding-inline: 20px;
  }
  .page { max-width: 1180px; margin-inline: auto; display: grid; gap: 24px; padding-block: 32px 56px; }

  .masthead { display: grid; gap: 8px; }
  .eyebrow { font-family: var(--font-data); font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-3); line-height: 1.1; text-wrap: balance; }
  .lede { color: var(--muted); max-width: 65ch; }
  .lede strong { color: var(--ink); font-weight: 600; }

  .grid { display: grid; gap: 16px; }
  .topic {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 16px 18px; display: grid; gap: 10px;
  }
  .topic-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .topic-head h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); }
  .share { font-family: var(--font-data); font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip {
    font-family: var(--font-data); font-size: 0.8125rem; font-weight: 500;
    padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .chip.concentrated { background: var(--gold-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--gold); }

  .topic-body { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 760px) { .topic-body { grid-template-columns: minmax(0, 1fr); } }
  .left { display: grid; gap: 12px; }

  .cloud { width: 100%; height: auto; display: block; }
  .cloud text { font-family: var(--font-display); font-weight: 500; }
  .cloud .w1 { fill: var(--accent); font-weight: 700; }
  .cloud .w2 { fill: var(--word-mid); }
  .cloud .w3 { fill: var(--word-low); }

  .periods figcaption, .motions-head { font-family: var(--font-data); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .periods svg { width: 100%; max-width: 320px; height: auto; display: block; }
  .periods .bar { fill: var(--accent); }
  .periods .val { fill: var(--ink); font-family: var(--font-data); font-size: 11px; }
  .periods .lab { fill: var(--muted); font-family: var(--font-data); font-size: 10.5px; }
  .periods .base { stroke: var(--rule); stroke-width: 1; }

  .motions { list-style: none; display: grid; gap: 6px; padding: 0; margin: 0; }
  .motions li { display: grid; gap: 1px; }
  .m-title { font-size: 0.9375rem; line-height: 1.3; overflow-wrap: anywhere; }
  /* The party chip sits on the Top motions heading line, without the heading's uppercase */
  .motions-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .motions-head .chip { text-transform: none; letter-spacing: 0; }
  /* The top 5 motions are the ones the party chip counts; a dashed rule separates the rest */
  .motions li.beyond { border-top: 1px dashed var(--rule); padding-top: 6px; }
  .m-meta { font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  footer { color: var(--muted); font-size: var(--step--1); border-top: 1px solid var(--rule); padding-top: 14px; max-width: 80ch; }
</style>

,"title":"Stiftelsen Skånehantverk i Landskrona","year":"1990","session":"1989/90","party":"C","partyName":"Centerpartiet","theta":0.65},{"id":"GC02Ub740","title":"S:t Lukasstiftelsens påbyggnadsutbildning i  psykoterapi","year":"1989","session":"1988/89","party":"MP","partyName":"Miljöpartiet","theta":0.556},{"id":"GC02Ub548","title":"Anslag till S:t Lukasstiftelsen","year":"1989","session":"1988/89","party":"FP","partyName":"Folkpartiet","theta":0.539},{"id":"GE02Ub257","title":"Lärlingsutbildning","year":"1991","session":"1990/91","party":"FP","partyName":"Folkpartiet","theta":0.516},{"id":"GE02Ub286","title":"Lärlingsutbildning","year":"1991","session":"1990/91","party":"FP","partyName":"Folkpartiet","theta":0.516},{"id":"GB02Ub359","title":"om lärlingsutbildning vid Stiftelsen Skånehantverk","year":"1988","session":"1987/88","party":"C","partyName":"Centerpartiet","theta":0.505},{"id":"G902ub206","title":"Lärlingsutbildning vid stiftelsen Skånehantverk","year":"1986","session":"1985/86","party":"C","partyName":"Centerpartiet","theta":0.469},{"id":"GB02Ub222","title":"om stöd till lärlingsutbildning inom Stiftelsen  Skånehantverk i Landskrona","year":"1988","session":"1987/88","party":"S","partyName":"Socialdemokraterna","theta":0.465}],"party":"L","partyName":"Liberalerna/Folkpartiet","partyCount":3}],"motions":13953,"periodCounts":[4025,3477,2879,3572],"generated":"2026-10-23","topics":32};</script>
<script>
(function () {
  const grid = document.getElementById('grid');
  const W = 560, H = 300;
  const layoutCache = {};

  const pct = v => (v * 100).toFixed(1) + '%';
  const canvas = document.createElement('canvas').getContext('2d');
  function measure(text, size, weight) {
    canvas.font = `${weight} ${size}px "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif`;
    return { w: canvas.measureText(text).width, h: size * 0.92 };
  }

  // Spiral word placement of one cloud at the given sizes; null if some word does not fit
  function placeWords(words, sizeOf) {
    const placed = [];
    for (let i = 0; i < words.length; i++) {
      const [text, p] = words[i];
      const size = sizeOf(p);
      const weight = i < 3 ? 700 : 500;
      const m = measure(text, size, weight);
      const bw = m.w + 4, bh = m.h + 2;
      let spot = null;
      for (let t = 0; t < 900 && !spot; t += 0.12) {
        const r = 3.2 * t;
        const x = W / 2 + r * Math.cos(t) * 1.6 - bw / 2;
        const y = H / 2 + r * Math.sin(t) - bh / 2;
        if (x < 2 || y < 2 || x + bw > W - 2 || y + bh > H - 2) { if (r > W) break; continue; }
        if (placed.every(q => x + bw <= q.x || q.x + q.w <= x || y + bh <= q.y || q.y + q.h <= y)) {
          spot = { x, y, w: bw, h: bh };
        }
      }
      if (!spot) return null;
      placed.push({ ...spot, text, p, size, weight, rank: i });
    }
    return placed;
  }

  // All clouds share one size scale (square root of the probability, between the smallest and largest
  // probability shown on the page), so word sizes can be compared between topics. If a word does not
  // fit in some cloud, all clouds shrink together and the layout restarts.
  function layoutAll(topics) {
    const ps = topics.flatMap(t => t.words.map(w => w[1]));
    const pmax = Math.max(...ps), pmin = Math.min(...ps);
    const sq = p => pmax === pmin ? 1 : (Math.sqrt(p) - Math.sqrt(pmin)) / (Math.sqrt(pmax) - Math.sqrt(pmin));
    let maxSize = 58, minSize = 13;
    for (let attempt = 0; attempt < 14; attempt++) {
      const sizeOf = p => minSize + sq(p) * (maxSize - minSize);
      const clouds = topics.map(t => placeWords(t.words, sizeOf));
      if (clouds.every(Boolean)) return Object.fromEntries(topics.map((t, i) => [t.num, clouds[i]]));
      maxSize *= 0.9;
      minSize = Math.max(10, minSize * 0.95);
    }
    return Object.fromEntries(topics.map(t => [t.num, []]));
  }

  function svgEl(name, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function cloudSvg(topic, modelKey) {
    if (!layoutCache[modelKey]) layoutCache[modelKey] = layoutAll(DATA.topicList);
    const svg = svgEl('svg', { class: 'cloud', viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': 'Word cloud: ' + topic.words.slice(0, 10).map(w => w[0]).join(', ') });
    for (const w of layoutCache[modelKey][topic.num]) {
      const tier = w.rank < 3 ? 'w1' : (w.rank < 12 ? 'w2' : 'w3');
      const t = svgEl('text', { x: (w.x + w.w / 2).toFixed(1), y: (w.y + w.h / 2).toFixed(1),
        'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': w.size.toFixed(1), class: tier });
      t.textContent = w.text;
      const tip = svgEl('title', {});
      tip.textContent = `${w.text}: ${(w.p * 100).toFixed(2)}%`;
      t.appendChild(tip);
      svg.appendChild(t);
    }
    return svg;
  }

  function periodChart(topic) {
    const cw = 320, ch = 132, top = 18, bottom = 34, left = 4;
    const max = Math.max(...topic.periods) || 1;
    const slot = (cw - left * 2) / topic.periods.length;
    const barW = slot * 0.56;
    const svg = svgEl('svg', { viewBox: `0 0 ${cw} ${ch}`, role: 'img',
      'aria-label': 'Share by period: ' + DATA.periods.map((p, i) => `${p} ${pct(topic.periods[i])}`).join(', ') });
    const plotH = ch - top - bottom;
    topic.periods.forEach((v, i) => {
      const h = Math.max(1, (v / max) * plotH);
      const x = left + i * slot + (slot - barW) / 2;
      svg.appendChild(svgEl('rect', { class: 'bar', x: x.toFixed(1), y: (top + plotH - h).toFixed(1), width: barW.toFixed(1), height: h.toFixed(1), rx: 2 }));
      const val = svgEl('text', { class: 'val', x: (x + barW / 2).toFixed(1), y: (top + plotH - h - 5).toFixed(1), 'text-anchor': 'middle' });
      val.textContent = pct(v);
      svg.appendChild(val);
      // Period names are sessions ('1985/86–1993/94'): first and last session on two lines
      const [first, last] = DATA.periods[i].split('–');
      const lab = svgEl('text', { class: 'lab', x: (x + barW / 2).toFixed(1), y: ch - 18, 'text-anchor': 'middle' });
      lab.textContent = last ? `${first}–` : first;
      svg.appendChild(lab);
      if (last) {
        const lab2 = svgEl('text', { class: 'lab', x: (x + barW / 2).toFixed(1), y: ch - 5, 'text-anchor': 'middle' });
        lab2.textContent = last;
        svg.appendChild(lab2);
      }
    });
    svg.appendChild(svgEl('line', { class: 'base', x1: left, x2: cw - left, y1: top + plotH + 0.5, y2: top + plotH + 0.5 }));
    return svg;
  }

  function card(topic, modelKey) {
    const art = document.createElement('article');
    art.className = 'topic';
    art.id = `topic-${modelKey}-${topic.num}`;

    const head = document.createElement('header');
    head.className = 'topic-head';
    const h2 = document.createElement('h2');
    h2.textContent = `Topic ${topic.num}`;
    const share = document.createElement('span');
    share.className = 'share';
    share.textContent = `share ${pct(topic.share)}`;
    head.append(h2, share);

    const body = document.createElement('div');
    body.className = 'topic-body';
    const left = document.createElement('div');
    left.className = 'left';

    const fig = document.createElement('figure');
    fig.className = 'periods';
    const cap = document.createElement('figcaption');
    cap.textContent = 'Average share across all motions in each period';
    fig.append(cap, periodChart(topic));

    const mh = document.createElement('p');
    mh.className = 'motions-head';
    mh.textContent = 'Top motions';
    const chip = document.createElement('span');
    chip.className = 'chip' + (topic.partyCount >= 4 ? ' concentrated' : '');
    chip.textContent = `${topic.partyName} ${topic.partyCount}/5`;
    chip.title = `${topic.partyCount} of the top 5 motions have a first signatory from ${topic.partyName}`;
    mh.appendChild(chip);
    const ol = document.createElement('ol');
    ol.className = 'motions';
    topic.motions.forEach((m, i) => {
      const li = document.createElement('li');
      if (i === 5) li.className = 'beyond';
      const title = document.createElement('span');
      title.className = 'm-title';
      title.textContent = m.title || '(no title)';
      const meta = document.createElement('span');
      meta.className = 'm-meta';
      meta.textContent = `${m.session || m.year} · ${m.partyName} · ${m.id} · θ ${m.theta.toFixed(2)}`;
      li.append(title, meta);
      ol.appendChild(li);
    });
    const motions = document.createElement('div');
    motions.append(mh, ol);
    left.append(cloudSvg(topic, modelKey), fig);
    body.append(left, motions);
    art.append(head, body);
    return art;
  }

  // Largest overall share first
  function render() {
    const topics = DATA.topicList.slice().sort((a, b) => b.share - a.share);
    grid.replaceChildren(...topics.map(t => card(t, 'model')));
  }

  // Static text from the data
  document.getElementById('lede').innerHTML =
    `A ${DATA.topics}-topic LDA model fitted on the body text of <strong>${DATA.motions.toLocaleString('en')} motions</strong>.`;
  document.getElementById('footer').textContent =
    `Generated ${DATA.generated} by modeling/14_generate_topic_explorer.py from models/baseline_lda_${DATA.topics} ` +
    `(scikit-learn LDA, ${DATA.topics} topics). Motions per period: ` +
    DATA.periods.map((p, i) => `${p} ${DATA.periodCounts[i].toLocaleString('en')}`).join(', ') + '. ' +
    'Topic numbers are arbitrary: a model fitted with another seed numbers its topics differently.';

  // Measure words only once the display font has loaded, so the layout matches what is drawn
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load('500 20px "Bricolage Grotesque"'), document.fonts.load('700 20px "Bricolage Grotesque"')]).catch(() => {})
    : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(render);
})();
</script>
