# Publishes project/visualizations/ (index.html and the two explorers) to GitHub Pages.
# Runs when the visualizations change on main, or by hand from the Actions tab.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish visualizations

on:
  push:
    branches: [main]
    paths:
      - 'project/visualizations/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/visualizations
      - id: deployment
        uses: actions/deploy-pages@v4
